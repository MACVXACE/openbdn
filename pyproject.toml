[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "openbdn"
version = "0.2.0"
description = "Simulation SDK for a Biological Data Network (BDN-04): EQ-HBC channel, neural key exchange, and constrained DNA storage coding."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenBDN contributors" }]
keywords = [
    "human-body-communication",
    "electro-quasistatic",
    "neural-cryptography",
    "tree-parity-machine",
    "dna-storage",
    "adaptive-filter",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
app = ["streamlit>=1.37", "pandas>=2.0"]
dev = ["pytest>=7.4", "streamlit>=1.37", "pandas>=2.0"]

[project.scripts]
openbdn = "openbdn.cli:app"
openbdn-digital-twin = "openbdn.app:launch"

[tool.hatch.build.targets.wheel]
packages = ["openbdn"]

[tool.hatch.build.targets.sdist]
include = ["openbdn", "tests", "docs", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
